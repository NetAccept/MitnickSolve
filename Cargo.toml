[workspace]
resolver = "3"
members = [
    "crates/msk-core",
    "crates/msk-abi",
    "crates/msk-events",
    "crates/msk-ipc",
    "crates/msk-data",
    "crates/msk-llm",
    "crates/msk-mcp",
    "crates/msk-secret",
    "crates/msk-store",
    "crates/msk-wasm",
    "crates/msk-loader",
    "crates/msk-kernel",
    "crates/msk-tui",
    "crates/msk-web",
    "crates/msk-eval",
    "crates/msk-testkit",
    "crates/msk-test-component",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
msk-abi = { path = "crates/msk-abi" }
msk-core = { path = "crates/msk-core" }
msk-data = { path = "crates/msk-data" }
msk-events = { path = "crates/msk-events" }
msk-ipc = { path = "crates/msk-ipc" }
msk-llm = { path = "crates/msk-llm" }
msk-loader = { path = "crates/msk-loader" }
msk-mcp = { path = "crates/msk-mcp" }
msk-secret = { path = "crates/msk-secret" }
msk-store = { path = "crates/msk-store" }
msk-wasm = { path = "crates/msk-wasm" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ed25519-dalek = "2"
libloading = "0.8"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.5", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
