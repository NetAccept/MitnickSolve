name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  envd-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Vet
        working-directory: tools/envd
        run: go vet ./...
      - name: Test
        working-directory: tools/envd
        run: go test ./...

  envd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: dtolnay/rust-toolchain@stable
      - name: Vet
        working-directory: tools/envd
        run: go vet ./...
      - name: Test
        working-directory: tools/envd
        run: go test ./...
      - name: Build envd
        working-directory: tools/envd
        run: go build -o ../../target/debug/envd ./cmd/envd
      - name: envd service smoke
        run: |
          set -euo pipefail
          rm -rf .msk/envd-ci
          mkdir -p .msk
          target/debug/envd --service --root .msk/envd-ci \
            --listen 127.0.0.1:17800 --data-listen 127.0.0.1:17801 \
            --token ci-token --net-allow 127.0.0.0/8 >.msk/envd-ci.log 2>&1 &
          envd_pid=$!
          trap 'kill "$envd_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:17800/healthz >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:17800/healthz | jq -e '.ok == true'
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            | jq -e '.result.serverInfo.name == "envd"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:17800/mcp -d '{}')" = 401 ]
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"env_create","arguments":{"profile":"isolated"}}}' \
            | jq -e '.result.isError == true and .result.structuredContent.error.code == 6'
          env_id=$(curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"env_create","arguments":{"profile":"dev"}}}' \
            | jq -r '.result.structuredContent.data.env_id')
          test -n "$env_id"
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"transform","arguments":{"op":"base64_encode","data":"flag"}}}' \
            | jq -e '.result.structuredContent.data.result == "ZmxhZw=="'
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"tools/call\",\"params\":{\"name\":\"net_dns\",\"arguments\":{\"env_id\":\"$env_id\",\"name\":\"localhost\",\"type\":\"A\"}}}" \
            | jq -e '.result.structuredContent.data.values | length > 0'
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":6,\"method\":\"tools/call\",\"params\":{\"name\":\"write_file\",\"arguments\":{\"env_id\":\"$env_id\",\"path\":\"note.txt\",\"data\":\"aGVsbG8K\"}}}" \
            | jq -e '.result.structuredContent.ok == true'
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":7,\"method\":\"tools/call\",\"params\":{\"name\":\"file_type\",\"arguments\":{\"env_id\":\"$env_id\",\"path\":\"note.txt\"}}}" \
            | jq -e '.result.structuredContent.data.kind == "text"'
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":8,\"method\":\"tools/call\",\"params\":{\"name\":\"file_hash\",\"arguments\":{\"env_id\":\"$env_id\",\"path\":\"note.txt\"}}}" \
            | jq -e '.result.structuredContent.data.hashes.sha256 | length == 64'
          curl -fsS -X POST http://127.0.0.1:17800/mcp \
            -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"tools/call\",\"params\":{\"name\":\"net_dial\",\"arguments\":{\"env_id\":\"$env_id\",\"host\":\"192.0.2.1\",\"port\":80}}}" \
            | jq -e '.result.isError == true and .result.structuredContent.error.name == "PERMISSION_DENIED"'
      - name: envd isolated launcher smoke
        run: |
          set -euo pipefail
          rm -rf .msk/envd-ci2 /tmp/envd-launcher.log
          mkdir -p .msk
          cat > .msk/envd-launcher.sh <<'EOF'
          #!/bin/sh
          echo "$@" >> /tmp/envd-launcher.log
          mkdir -p .msk/ci
          echo '{"provider":"scripted-demo","model":"","effort":"default","base_url":""}' > .msk/ci/tui-config.json
          exec "$@"
          EOF
          chmod +x .msk/envd-launcher.sh
          target/debug/envd --service --root .msk/envd-ci2 \
            --listen 127.0.0.1:17802 --data-listen 127.0.0.1:17803 \
            --token isolated-token \
            --sandbox-command "$PWD/.msk/envd-launcher.sh" \
            >.msk/envd-ci2.log 2>&1 &
          envd_pid=$!
          trap 'kill "$envd_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:17802/healthz >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          env_id=$(curl -fsS -X POST http://127.0.0.1:17802/mcp \
            -H 'Authorization: Bearer isolated-token' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"env_create","arguments":{"profile":"isolated"}}}' \
            | jq -r '.result.structuredContent.data.env_id')
          test -n "$env_id"
          curl -fsS -X POST http://127.0.0.1:17802/mcp \
            -H 'Authorization: Bearer isolated-token' -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"exec\",\"arguments\":{\"env_id\":\"$env_id\",\"argv\":[\"/bin/sh\",\"-c\",\"echo isolated-ok\"]}}}" \
            | jq -e '.result.structuredContent.data.stdout | contains("isolated-ok")'
          grep -q '/bin/sh' /tmp/envd-launcher.log
      - name: Build kernel
        run: |
          cargo build -p msk-kernel --bins
          cargo build -p msk-tui
          cargo build -p msk-web
          cargo build -p msk-eval
      - name: Build component fixture
        run: |
          set -euo pipefail
          cargo build -p msk-test-component
          cargo build -p msk-loader --bin msk-component-host --bin msk-component-check
          artifact=$(find target/debug -type f \
            \( -name 'libmsk_test_component*.so' -o -name 'libmsk_test_component*.dylib' -o -name 'msk_test_component*.dll' \) \
            | head -1)
          test -n "$artifact"
          cargo run -q -p msk-loader --example sign_test_fixture -- "$artifact" .msk/component-fixture
          target/debug/msk-component-check \
            --manifest .msk/component-fixture/manifest.json \
            --trust .msk/component-fixture/trust.json | grep -q "component check ok"
      - name: Component host abort and restart
        run: |
          cargo test -p msk-kernel --lib component::tests::out_of_process_host_isolates_a_component_abort -- --exact
      - name: Daemon interactive session smoke
        run: |
          set -euo pipefail
          rm -rf .msk/ci
          mkdir -p .msk/ci
          mkdir -p .msk/ci/workspace
          target/debug/mskd --root .msk/ci --store .msk/ci/store.db \
            --envd target/debug/envd --workspace .msk/ci/workspace \
            --tools-dir tools/wasm \
            --component-manifest .msk/component-fixture/manifest.json \
            --component-trust .msk/component-fixture/trust.json \
            --component-host target/debug/msk-component-host \
            >.msk/ci/daemon.log 2>&1 &
          daemon=$!
          web_pid=
          trap 'kill "$daemon" $web_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if [ -f .msk/ci/ipc.token ]; then break; fi
            sleep 0.1
          done
          target/debug/mskctl --root .msk/ci bb-set ci '{"ok":true}' >/dev/null
          target/debug/mskctl --root .msk/ci bb-get ci | jq -e '.value.ok == true'
          task=$(target/debug/mskctl --root .msk/ci create --interactive --max-context-tokens 5000 | jq -r .task_id)
          [ "$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .max_context_tokens)" = 5000 ]
          for _ in $(seq 1 100); do
            state=$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .state)
            if [ "$state" = waiting_input ]; then break; fi
            sleep 0.1
          done
          [ "$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .state)" = waiting_input ]
          target/debug/mskctl --root .msk/ci send --task "$task" --text "first turn" >/dev/null
          for _ in $(seq 1 100); do
            turns=$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .turns)
            if [ "$turns" = 1 ]; then break; fi
            sleep 0.1
          done
          [ "$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .turns)" = 1 ]
          target/debug/mskctl --root .msk/ci send --task "$task" --text "second turn" >/dev/null
          for _ in $(seq 1 100); do
            turns=$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .turns)
            if [ "$turns" = 2 ]; then break; fi
            sleep 0.1
          done
          [ "$(target/debug/mskctl --root .msk/ci state "$task" | jq -r .turns)" = 2 ]
          grep -q '"kind":"turn.end"' .msk/ci/tasks/"$task"/events.jsonl
          component_task=$(target/debug/mskctl --root .msk/ci create --headless \
            --provider component --goal "component smoke" | jq -r .task_id)
          for _ in $(seq 1 150); do
            state=$(target/debug/mskctl --root .msk/ci state "$component_task" | jq -r .state)
            if [ "$state" = done ] || [ "$state" = failed ]; then break; fi
            sleep 0.1
          done
          [ "$(target/debug/mskctl --root .msk/ci state "$component_task" | jq -r .state)" = done ]
          target/debug/mskctl --root .msk/ci result "$component_task" \
            | jq -r .transcript | grep -q "component hello"
          plan_task=$(target/debug/mskctl --root .msk/ci create --headless \
            --demo echo --provider scripted-demo --mode plan \
            --goal "plan the smoke assessment" | jq -r .task_id)
          for _ in $(seq 1 100); do
            state=$(target/debug/mskctl --root .msk/ci state "$plan_task" | jq -r .state)
            if [ "$state" = done ] || [ "$state" = failed ]; then break; fi
            sleep 0.1
          done
          [ "$(target/debug/mskctl --root .msk/ci state "$plan_task" | jq -r .mode)" = plan ]
          auto_task=$(target/debug/mskctl --root .msk/ci create --headless \
            --demo echo --provider scripted-demo --mode auto \
            --goal "harden ssh and patch the firewall" | jq -r .task_id)
          [ "$(target/debug/mskctl --root .msk/ci state "$auto_task" | jq -r .mode)" = harden ]
          target/debug/mskctl --root .msk/ci events --task "$task" --limit 5 \
            | jq -e '.count > 0'
          for _ in 1 2; do
            target/debug/mskctl --root .msk/ci create --interactive --parent-task cap >/dev/null
          done
          if target/debug/mskctl --root .msk/ci create --interactive --parent-task cap >/dev/null 2>&1; then
            echo "third subagent was accepted"
            exit 1
          fi
          fork_task=$(target/debug/mskctl --root .msk/ci create --headless \
            --fork-from "$task" --goal "fork branch" | jq -r .task_id)
          for _ in $(seq 1 100); do
            state=$(target/debug/mskctl --root .msk/ci state "$fork_task" | jq -r .state)
            if [ "$state" = done ] || [ "$state" = failed ]; then break; fi
            sleep 0.1
          done
          [ "$(target/debug/mskctl --root .msk/ci state "$fork_task" | jq -r .state)" = done ]
          grep -q '"kind":"session.checkpoint_resume"' \
            .msk/ci/tasks/"$fork_task"/events.jsonl
          target/debug/msk-web --root .msk/ci --listen 127.0.0.1:17820 \
            --token web-ci-token >.msk/ci/web.log 2>&1 &
          web_pid=$!
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:17820/ >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:17820/ | grep -q "<title>MitnickSolve</title>"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17820/api/tasks)" = 401 ]
          curl -fsS -H 'Authorization: Bearer web-ci-token' \
            http://127.0.0.1:17820/api/health | jq -e '.ok == true'
          curl -fsS -H 'Authorization: Bearer web-ci-token' \
            http://127.0.0.1:17820/api/tasks | jq -e '.tasks | length > 0'
          web_task=$(curl -fsS -H 'Authorization: Bearer web-ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"goal":"web smoke","provider":"scripted","interactive":false,"headless":true,"approvals":"allow"}' \
            http://127.0.0.1:17820/api/tasks | jq -r .task_id)
          for _ in $(seq 1 100); do
            web_state=$(curl -fsS -H 'Authorization: Bearer web-ci-token' \
              http://127.0.0.1:17820/api/tasks/"$web_task" | jq -r .task.state)
            if [ "$web_state" = done ] || [ "$web_state" = failed ]; then break; fi
            sleep 0.1
          done
          [ "$(curl -fsS -H 'Authorization: Bearer web-ci-token' \
            http://127.0.0.1:17820/api/tasks/"$web_task" | jq -r .task.state)" = done ]
          target/debug/msk-eval --root .msk/ci --suite evals/core.json
          echo '{"provider":"scripted-demo","model":"","effort":"default","base_url":""}' > .msk/ci/tui-config.json
          target/debug/msk-tui --root .msk/ci --snapshot --provider scripted \
            | grep -q "MitnickSolve"
          target/debug/msk-tui --root .msk/ci --snapshot --provider scripted \
            --snapshot-palette | grep -q "commands"
          target/debug/msk-tui --root .msk/ci --snapshot --provider scripted \
            --snapshot-sessions | grep -q "sessions"
          target/debug/msk-tui --root .msk/ci --snapshot --provider scripted \
            --snapshot-findings | grep -q "assessment findings"
          target/debug/msk-tui --root .msk/ci --snapshot --provider scripted \
            --snapshot-modes | grep -q "agent mode"
          target/debug/msk-tui --root .msk/ci --snapshot --provider scripted \
            --snapshot-permissions | grep -q "permissions"
          target/debug/msk-tui --root .msk/ci --snapshot --setup --setup-step effort \
            --provider openai | grep -q "Reasoning effort"
      - name: TLS service and data plane smoke
        run: |
          set -euo pipefail
          rm -rf .msk/tls-ci
          mkdir -p .msk/tls-ci
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .msk/tls-ci/ca.key -out .msk/tls-ci/ca.pem \
            -days 1 -subj "/CN=Mitnick CI CA" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout .msk/tls-ci/server.key -out .msk/tls-ci/server.csr \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          openssl x509 -req -in .msk/tls-ci/server.csr \
            -CA .msk/tls-ci/ca.pem -CAkey .msk/tls-ci/ca.key -CAcreateserial \
            -out .msk/tls-ci/server.pem -days 1 -copy_extensions copy >/dev/null 2>&1
          target/debug/envd --service --root .msk/tls-ci/envd \
            --listen 127.0.0.1:17810 --data-listen 127.0.0.1:17811 \
            --token tls-ci-token \
            --tls-cert .msk/tls-ci/server.pem --tls-key .msk/tls-ci/server.key \
            >.msk/tls-ci/envd.log 2>&1 &
          envd_pid=$!
          daemon_pid=
          trap 'kill "$envd_pid" $daemon_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl -kfsS https://localhost:17810/healthz >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          mkdir -p .msk/tls-ci/workspace
          target/debug/mskd --root .msk/tls-ci/daemon \
            --workspace .msk/tls-ci/workspace \
            --envd-url https://localhost:17810 --envd-token tls-ci-token \
            --envd-ca .msk/tls-ci/ca.pem \
            --envd-data-addr 127.0.0.1:17811 --envd-data-tls \
            --envd-data-tls-name localhost \
            --tools-dir tools/wasm >.msk/tls-ci/daemon.log 2>&1 &
          daemon_pid=$!
          for _ in $(seq 1 100); do
            if [ -f .msk/tls-ci/daemon/ipc.token ]; then break; fi
            sleep 0.1
          done
          session=$(target/debug/mskctl --root .msk/tls-ci/daemon \
            terminal-open --cols 80 --rows 24 | jq -r .session_id)
          target/debug/mskctl --root .msk/tls-ci/daemon terminal-write \
            --session "$session" --line "echo tls-ok" >/dev/null
          output=$(target/debug/mskctl --root .msk/tls-ci/daemon terminal-read \
            --session "$session" --timeout-ms 3000)
          printf '%s' "$output" | grep -q "tls-ok"
          target/debug/mskctl --root .msk/tls-ci/daemon terminal-close \
            --session "$session" >/dev/null
